<section class="page">
  <div class="product-grid">
    @for (laptop of laptops; track laptop.name) {
      <div class="product-card">
        <div class="product-thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4.5" width="16" height="10.5" rx="1.2" />
            <path d="M2.5 19.5h19l-1.5-3h-16l-1.5 3Z" />
          </svg>
        </div>

        <div class="product-body">
          <h3 class="product-name">{{ laptop.name }}</h3>
          <p class="product-spec">{{ laptop.spec }}</p>

          <div class="product-footer">
            <span class="product-price">{{ laptop.price | currency: 'IDR' : 'symbol-narrow' : '1.0-0' }}</span>
            <span class="product-stock">Stok: {{ laptop.stock }}</span>
          </div>
        </div>
      </div>
    }
  </div>
</section>
