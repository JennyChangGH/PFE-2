<section class="card">
  <h2>Form Validation</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <label>
      Username
      <input formControlName="username" type="text" placeholder="Minimal 4 karakter" />
      @if (form.controls.username.pending) {
        <span class="pending">Memeriksa ketersediaan username...</span>
      }
      @if (form.controls.username.invalid && form.controls.username.touched) {
        @if (form.controls.username.errors?.['required']) {
          <span class="errors">Username wajib diisi.</span>
        }
        @if (form.controls.username.errors?.['minlength']) {
          <span class="errors">Username minimal 4 karakter.</span>
        }
        @if (form.controls.username.errors?.['forbiddenUsername']) {
          <span class="errors">Username tersebut tidak diperbolehkan.</span>
        }
        @if (form.controls.username.errors?.['usernameTaken']) {
          <span class="errors">Username sudah digunakan, coba yang lain.</span>
        }
      }
    </label>

    <label>
      Email
      <input formControlName="email" type="email" placeholder="nama@contoh.com" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        @if (form.controls.email.errors?.['required']) {
          <span class="errors">Email wajib diisi.</span>
        }
        @if (form.controls.email.errors?.['email']) {
          <span class="errors">Format email tidak valid.</span>
        }
      }
    </label>

    <label>
      Password
      <input formControlName="password" type="password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        @if (form.controls.password.errors?.['required']) {
          <span class="errors">Password wajib diisi.</span>
        }
        @if (form.controls.password.errors?.['minlength']) {
          <span class="errors">Password minimal 6 karakter.</span>
        }
      }
    </label>

    <label>
      Konfirmasi Password
      <input formControlName="confirmPassword" type="password" />
      @if (form.controls.confirmPassword.touched) {
        @if (form.controls.confirmPassword.errors?.['required']) {
          <span class="errors">Konfirmasi password wajib diisi.</span>
        }
        @if (form.errors?.['passwordMismatch']) {
          <span class="errors">Konfirmasi password tidak cocok dengan password.</span>
        }
      }
    </label>

    <fieldset>
      <legend>Newsletter</legend>
      <label>
        <input formControlName="subscribeNewsletter" type="checkbox" />
        Berlangganan newsletter (nomor telepon menjadi wajib)
      </label>
    </fieldset>

    <label>
      Nomor Telepon
      <input formControlName="phone" type="tel" placeholder="555-123-4567" />
      @if (form.controls.phone.invalid && form.controls.phone.touched) {
        @if (form.controls.phone.errors?.['required']) {
          <span class="errors">Nomor telepon wajib diisi karena berlangganan newsletter.</span>
        }
        @if (form.controls.phone.errors?.['pattern']) {
          <span class="errors">Gunakan format 555-123-4567.</span>
        }
      }
    </label>

    <button type="submit" [disabled]="form.invalid || form.pending">Daftar</button>
  </form>

  @if (successPayload()) {
    <pre class="payload">{{ successPayload() }}</pre>
  }
</section>
